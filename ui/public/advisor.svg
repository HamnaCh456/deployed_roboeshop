<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Servo">
  <!-- The assistant's avatar: the Servo mark in white on an ink disc, so
       every reply carries the brand. Master geometry: components/Mark.tsx,
       scaled 1.5x and centred. -->
  <circle cx="32" cy="32" r="32" fill="#171717"/>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="32" cy="41" r="3.3" fill="#000"/>
    <path d="M32 41 L43.25 29.75" stroke="#000" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  </mask>
  <path d="M14 41 A18 18 0 0 1 50 41 Z" fill="#FFFFFF" mask="url(#cut)"/>
</svg>
